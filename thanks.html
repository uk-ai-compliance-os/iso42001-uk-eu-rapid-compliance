<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Sent | UK AI Compliance OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.6rem; color: #f8fafc; margin-bottom: 12px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 16px; font-size: 1rem; }
        .highlight { color: #fbbf24; font-weight: 600; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); }
        .footer { margin-top: 32px; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📧</div>
        <h1>Checklist Incoming</h1>
        <p>Your personalised 90-day action checklist is being prepared.</p>
        <p class="highlight">Check your inbox (and spam folder) within 4 hours.</p>
        <p style="margin-top: 20px; font-size: 0.95rem;">While you wait, explore the free ISO 42001 toolkit:</p>
        <a href="https://github.com/uk-ai-compliance-os/iso42001-uk-eu-rapid-compliance" class="btn">Open Free Toolkit →</a>
        <div class="footer">
            <p>Built by UK-EU AI Compliance OS</p>
            <p>Questions? <a href="mailto:compliance.architect@protonmail.com" style="color: #3b82f6; text-decoration: none;">compliance.architect@protonmail.com</a></p>
        </div>
    </div>
</body>
</html>
